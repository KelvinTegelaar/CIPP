name: CIPP Frontend Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.fork == false
    name: Build and Upload CIPP Frontend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v6

      # Set up Node.js
      - name: Get Node version
        id: get_node_version
        run: |
          node_raw_version=$(node -p "require('./package.json').engines.node")
          node_sanitized_version=$(echo $node_raw_version | sed -E 's/[^0-9.]+//g')
          echo "node_version=$node_sanitized_version" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}

      # Install dependencies
      - name: Install Dependencies
        run: yarn install

      # Lint
      - name: Lint
        run: npm run lint

      # Security audit (fail on high/critical)
      - name: Security Audit
        run: npm audit --audit-level=high

      # Build the project
      - name: Build Project
        run: npm run build

      # Update version.json with commit hash
      - name: Update version.json
        run: |
          VERSION=$(jq -r '.version' public/version.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "{\"version\": \"${VERSION}\", \"commit\": \"${SHORT_SHA}\"}" > out/version.json

      # Create ZIP File in a New Source Directory
      - name: Prepare and Zip Build Files
        run: |
          mkdir -p build
          cp staticwebapp.config.json out/
          zip -r build/latest.zip out

      # Authenticate via Workload Identity Federation (no long-lived secrets)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Upload to Azure Blob Storage using Azure CLI
      - name: Upload to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login \
            --destination cipp \
            --source build/ \
            --overwrite true
