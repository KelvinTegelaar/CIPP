name: Sync fork with upstream (rebase)

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase local commits onto upstream
        id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/KelvinTegelaar/CIPP.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rebase upstream/main
          git push --force-with-lease origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not fire push-triggered workflows,
      # so kick the deploy explicitly after a real sync.
      - name: Trigger deploy
        if: steps.rebase.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cipp-workflow.yml --ref main -R "$GITHUB_REPOSITORY"
